{% extends 'html/base.html' %}
{% block title %} Estadísticas {% endblock %}

{% block css %}
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/estadisticas.css') }}"/>
<!-- Importamos Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block content %}
<main class="container">
    <h1 style="text-align: center; color: white;"> Panel de Estadísticas </h1>
    <div class="dashboard-container">
        <!-- Gráfico 1: Líneas (Avistamientos por Día) -->
        <div class="grafico-card">
            <h3>Avistamientos por Día</h3>
            <canvas id="graficoDias"></canvas>
        </div>
        <!-- Gráfico 2: Torta (Avistamientos por Tipo de Ave) -->
        <div class="grafico-card">
            <h3>Avistamientos por Tipo de Ave</h3>
            <canvas id="graficoTipos"></canvas>
        </div>
        <!-- Gráfico 3: Barras (Voluntarios por Comuna) -->
        <div class="grafico-card">
            <h3>Voluntarios por Comuna</h3>
            <canvas id="graficoVoluntarios"></canvas>
        </div>
    </div>
</main>

<div class="button-container" style="text-align: center; margin-top: 20px;">
    <button id="submit-btn" class="button" type="button"> Volver al inicio </button>
</div>
{% endblock %}

{% block javascript %}
<script src="{{ url_for('static', filename='js/estadisticas.js') }}"></script>
{% endblock %}
