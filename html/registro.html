<!DOCTYPE html>
<html lang="es"> 
<head>
    <title> Registros </title>
    <link rel="stylesheet" type="text/css" href="../css/registro.css">    
</head>
<body>
    <div class="container">
        <div class="texto">
            <h1> Registro Voluntario  <h1>     
        </div>
        <form class="formulario" id="login-form">
            <label for="nombre"> Nombre </label>
            <input id="nombre" name="nombre" type="nombre" required><br>

            <label for="rut"> Rut </label>
            <input id="rut" name="rut" type="rut" required><br>

            <label for="email"> Email </label>
            <input id="email" name="email" type="email" required><br>

            <label for="telefono"> Telefono </label>
            <input id="telefono" name="telefono" type="telefono" required><br>

            <label for="select-region"> Región </label>
            <select id="select-region" name="region" required>
                <option value=""> Seleccione una región: </option>
            </select><br>

            <label for="select-comuna"> Comuna </label>
            <select id="select-comuna" name="select-comuna" required>
                <option value=""> Seleccione una comuna: </option>
            </select><br>

            <label for="calle_numero"> Calle y Número </label>
            <input id="calle_numero" name="calle_numero" type="calle_numero" required><br>

            <button id="envio" type="button"> Registrarse </button>
        </form>
    </div>
    <script lang="javascript" src="../js/registro.js"></script>
    <script lang="javascript" src="../js/select.js"></script>
</body>
</html>
