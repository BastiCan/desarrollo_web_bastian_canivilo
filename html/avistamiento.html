<!DOCTYPE html>
<html lang="es"> 
<head>
    <title> Avistamientos </title>
    <link rel="stylesheet" type="text/css" href="../css/avistamiento.css"> 
</head>
<body>
    <div class="main-container">
        <div id="title">
            <h1> Informar Avistamiento  </h1>
        </div>
        <div id="val-box" hidden>
            <h2 id="val-msg"></h2>
            <ul id="val-list"></ul>
        </div>
        <form name="formulario" method="post" enctype="multipart/form-data">            
            <label for="tipo"> Tipo </label>
            <input id="tipo" name="tipo" type="tipo" required><br>
        
            <label for="nombre"> Nombre </label>
            <input id="nombre" name="nombre" type="nombre" required><br>
            
            <label for="lugar"> Lugar </label>
            <input id="lugar" name="lugar" type="lugar" required><br>
            
            <label for="fecha"> Fecha </label>
            <input id="fecha" name="fecha" type="fecha" required><br>
            
            <label for="hora"> Hora </label>
            <input id="hora" name="hora" type="hora" required><br>        
        
            <label for="archivos"> Foto o Video </label>
            <input id="archivos" name="archivo" type="archivo" multiple accept="image/*,video/*" required><br>
            
            <div>
                <button id="submit-btn" type="button"> Agregar Avistamiento </button>
            </div>
        </form>
    </div>
    <script lang="javascript" src="../js/avistamiento.js"></script>
</body>
</html>
