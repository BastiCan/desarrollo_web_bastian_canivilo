<!DOCTYPE html>
<html lang="es"> 
<head>
    <title> Listado </title>    
    <link rel="stylesheet" type="text/css" href="../css/listado.css">
</head>
<body>
    <div class="container-filtros">
        <label for="filtro-campo"> Ordenar por: </label>
        <select id="filtro-campo">
            <option value="tipo"> Tipo </option>
            <option value="nombre"> Nombre </option>
            <option value="lugar"> Lugar </option>
            <option value="fecha"> Fecha </option>
            <option value="hora"> Hora </option>
        </select>
        <select id="filtro-orden">
            <option value="asc"> Ascendente (A - Z / Más Antiguo) </option>
            <option value="desc"> Descendente (Z - A / Más Reciente) </option>
        </select>
    </div>
    <div class="container-table">
        <div id="cabecera-table">
            <h1> Listado de los Ultimos Avistamientos </h1>
            <div class="colums-title">
                <span> Tipo </span>
                <span> Nombre </span>
                <span> Lugar </span>
                <span> Fecha </span>
                <span> Hora </span>
             </div>
        </div>
        <div id="list-avistamientos"></div>
    </div>
    <script lang="javascript" src="../js/listado.js"></script>
</body>
</html>
