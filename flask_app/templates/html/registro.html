{% extends 'base.html' %}
{% block title %} Registro Voluntario {% endblock %}
{% block css %}
<link 
    rel="stylesheet" 
    type="text/css" 
    href="{{ url_for('static', filename='css/registro.css')}}"
/>
{% endblock %}
{% block content %}  
<main class="container">
    <div class="texto">
        <h1> Registro Voluntario </h1>     
    </div>
    <div id="val-box" hidden>
        <h2 id="val-msg"></h2>
        <ul id="val-list"></ul>
    </div>

    {% if error %}
        <div class="error-message" style="color: #ff4c4c; font-weight: bold; background: #ffe6e6; padding: 10px;
                    border-radius: 5px; margin-bottom: 15px; text-align: center;">
            {{ error}}
        </div>
    {% endif %}

    <form id="form-registro" name="formulario" action="{{ url_for('volunario')}}" method="post" enctype="multipart/form-data">
        <label for="nombre"> Nombre </label>
        <input id="nombre" name="nombre" type="text" required><br>

        <label for="email"> Email </label>
        <input id="email" name="email" type="email" required><br>

        <label for="telefono"> Telefono </label>
        <input id="telefono" name="telefono" type="tel" required><br>

        <label for="select-region"> Región </label>
        <select id="select-region" name="region" required>
            <option value=""> Seleccione una región: </option>
        </select><br>

        <label for="select-comuna"> Comuna </label>
        <select id="select-comuna" name="select-comuna" required>
            <option value=""> Seleccione una comuna: </option>
            {% for comuna in comunas %}
                <optio value="{{ comuna.id }}">{{ comuna.nombre }}</optio>
            {% endfor %}
        </select><br>
        
        <button id="submit-btn" type="submit"> Registrarse </button>
    </form>
</main>
{% endblock %}
{% block javascript %}
<script src="{{ url_for('static', filename='js/registro.js') }}"></script> 
<script src="{{ url_for('static', filename='js/select.js') }}"></script> 
{% endblock %}
