<!DOCTYPE html>
<html lang="es"> 
<head>
    <title> Listado </title>    
    <link rel="stylesheet" type="text/css" href="../css/listado.css">
</head>
<body>
    <div class="title">
        <h1> Listado de los Ultimos Avistamientos </h1>
    </div>
    <section class="container-filtros">
        <label for="filtro-campo"> Ordenar por: </label>
        <select id="filtro-campo">
            <option value="tipo"> Tipo </option>
            <option value="nombre"> Nombre </option>
            <option value="lugar"> Lugar </option>
            <option value="fecha"> Fecha </option>
            <option value="hora"> Hora </option>
        </select>

        <label for="filtro-tipo"> Filtrar por Tipo: </label>
        <select id="filtro-tipo">
            <option value="todos"> Todos los tipos </option>
            <option value="Ave marina"> Ave marina </option>
            <option value="Ave rapaz"> Ave rapaz </option>
            <option value="Ave acuática"> Ave acuática </option>
            <option value="Paseriforme"> Paseriforme </option>
        </select>
        
        <select id="filtro-orden">
            <option value="asc"> Ascendente (A - Z / Más Antiguo) </option>
            <option value="desc"> Descendente (Z - A / Más Reciente) </option>
        </select>
    </section>
    <main class="container-table">
        <header id="cabecera-table">
            <div class="colums-title">
                <span> Tipo </span>
                <span> Nombre </span>
                <span> Lugar </span>
                <span> Fecha </span>
                <span> Hora </span>
             </div>
        </header>
        <div id="list-avistamientos"></div>
        <div class="paginacion">
            <button id="btn-anterior" class="btn-pag"> Anterior </button>
            <span id="indicador-pagina"> Página 1 </span>
            <button id="btn-siguiente" class="btn-pag"> Siguiente </button>
        </div>
    </main>
    <div class="button">
        <button id="submit-btn" class="button" type="button"> Volver al inicio </button>
    </div>
    <script lang="javascript" src="../js/listado.js"></script>
</body>
</html>
